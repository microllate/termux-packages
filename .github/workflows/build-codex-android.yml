name: Build Codex for Termux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the build patch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out Termux build recipe for Codex 0.170.0
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: c99df1c652ab3dbada721f527e403e6a97f682a9
          path: termux-build
          persist-credentials: false

      - name: Build Android ARM64 package
        working-directory: termux-build
        run: |
          cp ../packages/codex/99-scroll-and-quota-reset.patch packages/codex/
          mkdir -p codex-artifacts
          export CONTAINER_NAME=codex-android-builder
          (
            while true; do
              date -u
              free -h
              df -h .
              sleep 120
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          ./scripts/run-docker.sh bash -ec '
            mkdir -p /home/builder/codex-artifacts
            printf ready > /home/builder/codex-artifacts/.write-check
          '
          docker cp "$CONTAINER_NAME:/home/builder/codex-artifacts/.write-check" codex-artifacts/
          test "$(cat codex-artifacts/.write-check)" = ready
          ./scripts/run-docker.sh ./build-package.sh -i -j2 -a aarch64 -o /home/builder/codex-artifacts codex
          docker cp "$CONTAINER_NAME:/home/builder/codex-artifacts/." codex-artifacts/

      - name: Verify Android package
        working-directory: termux-build
        run: |
          shopt -s nullglob
          find codex-artifacts -maxdepth 1 -type f -print
          packages=(codex-artifacts/codex_*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Package)" = codex
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = aarch64
          dpkg-deb -I "${packages[0]}"

      - name: Upload Android ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: codex-termux-aarch64
          path: termux-build/codex-artifacts/codex_*.deb
          if-no-files-found: error
